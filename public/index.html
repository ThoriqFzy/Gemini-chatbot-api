<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thor - AI Career Mentor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="chat-header">
      <div class="header-left">
        <div class="avatar">
          <span class="avatar-icon">&#9889;</span>
        </div>
        <div class="header-info">
          <h1>Thor</h1>
          <span class="status">AI Career Mentor</span>
        </div>
      </div>
      <div class="header-right">
        <span class="status-dot"></span>
        <span class="status-label">Online</span>
      </div>
    </header>

    <div id="chat-box" class="chat-box" role="log" aria-label="Percakapan">
      <div class="welcome">
        <div class="welcome-icon">&#9889;</div>
        <h2>Halo, saya Thor!</h2>
        <p>Saya mentor AI karir siap membantu Anda mencapai tujuan karir. Ceritakan tentang diri Anda!</p>
      </div>
    </div>

    <footer class="chat-footer">
      <form id="chat-form">
        <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off" />
        <button type="submit" aria-label="Kirim pesan">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
